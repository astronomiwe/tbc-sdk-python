[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tbc-payments"
version = "0.1.0"
description = "Typed synchronous and asynchronous client for TBC Checkout payments."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TBC Payments SDK contributors"}]
keywords = ["tbc", "payments", "checkout", "georgia", "async"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7.10",
  "mypy>=1.13",
  "pip-audit>=2.7",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
]
release = ["build>=1.2", "twine>=5.1"]

[project.urls]
Documentation = "https://developers.tbcbank.ge/docs/checkout-api-overview"

[tool.hatch.build.targets.wheel]
packages = ["src/tbc_payments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=tbc_payments --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src/tbc_payments"]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests"]
