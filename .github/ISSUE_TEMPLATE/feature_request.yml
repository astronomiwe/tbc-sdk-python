name: Feature request
description: Propose a focused improvement to the SDK.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: "Describe the integration problem or TBC API gap."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: "Show a small Python usage example where practical."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
