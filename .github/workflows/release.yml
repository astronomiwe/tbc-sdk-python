name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the checked distributions to TestPyPI
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: Publish the checked distributions to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine .
      - name: Validate tag matches package version
        if: github.ref_type == 'tag'
        run: |
          package_version="$(python -c "import tbc_payments; print(tbc_payments.__version__)")"
          test "v${package_version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          }
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/package-test
          /tmp/package-test/bin/python -m pip install dist/*.whl
          /tmp/package-test/bin/python -c "import tbc_payments; print(tbc_payments.__version__)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: inputs.publish_testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  test-testpypi-install:
    name: Install from TestPyPI
    needs: publish-testpypi
    if: inputs.publish_testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: |
          python -m venv /tmp/testpypi-install
          /tmp/testpypi-install/bin/python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ tbc-payments
          /tmp/testpypi-install/bin/python -c "import tbc_payments; print(tbc_payments.__version__)"

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  test-pypi-install:
    name: Install from PyPI
    needs: publish-pypi
    if: github.event_name == 'push' || inputs.publish_pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: |
          python -m venv /tmp/pypi-install
          /tmp/pypi-install/bin/python -m pip install tbc-payments
          /tmp/pypi-install/bin/python -c "import tbc_payments; print(tbc_payments.__version__)"
